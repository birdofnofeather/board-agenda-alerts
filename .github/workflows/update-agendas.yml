name: Update agendas and publish the site

# This job does four things:
# 1. It looks for new or changed cluster meeting agendas.
# 2. It compares the cluster motions with the Board of Supervisors agendas.
# 3. It saves the results in the folder public/data.
# 4. It builds the website and publishes it on GitHub Pages.
#
# The job needs one secret, ANTHROPIC_API_KEY, for the AI summaries and the AI check.
# A problem with an agenda does not make the job fail. The job records the problem
# in a GitHub issue named "Tracker status" and sends a notice one time each week at most.
#
# The job runs one time each day. It also runs after each change to the code.
# You can start it by hand from the "Actions" tab on GitHub.
on:
  schedule:
    - cron: "23 15 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update-agendas
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the agenda reader
        run: pip install -r scripts/requirements.txt

      - name: Look for new agendas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROBLEMS_FILE: ${{ runner.temp }}/problems.md
        run: python scripts/update_agendas.py

      - name: Save the data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if ! git diff --cached --quiet; then
            git commit -m "Update agenda data"
            git pull --rebase --autostash
            git push
          fi

      - name: Record problems, with one notice each week at most
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROBLEMS_FILE: ${{ runner.temp }}/problems.md
        run: |
          problems="$(cat "$PROBLEMS_FILE" 2>/dev/null || true)"
          number="$(gh issue list --state open --search 'Tracker status in:title' --json number --jq '.[0].number // empty')"
          today="$(date -u +%Y-%m-%d)"
          if [ -z "$problems" ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body "No problems on $today. You can close this issue."
            fi
            exit 0
          fi
          body="$(printf 'The daily job found these problems on %s:\n\n%s\n\nThe job tries again each day. This text always shows the newest result.' "$today" "$problems")"
          if [ -z "$number" ]; then
            gh issue create --title "Tracker status" --body "$body"
            exit 0
          fi
          gh issue edit "$number" --body "$body"
          last="$(gh issue view "$number" --json createdAt,comments --jq '[.createdAt, .comments[].createdAt] | max')"
          if [ "$(date -u -d "$last" +%s)" -lt "$(date -u -d '7 days ago' +%s)" ]; then
            gh issue comment "$number" --body "The tracker continues to have problems. See the text at the top of this issue."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the website
        run: |
          npm ci
          npm run build

      - name: Check that GitHub Pages is on
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null)" = "workflow" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not on. The website was not published. See the README file."
          fi

      - name: Prepare the website files
        if: steps.pages.outputs.on == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publish the website
        if: steps.pages.outputs.on == 'true'
        uses: actions/deploy-pages@v4
